name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22]
        include:
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # Checks what both install routes deliver, on each system people use. npx can't install a pinned commit, so the real
  # download is checked by verify-release below, once the release branch has moved.
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the package and start it with npx
        run: |
          file=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          cd "$RUNNER_TEMP"
          npx -y --package="./$file" warframe-builds-mcp --version
      - name: Pack the installable file and start the server from it
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack . "$RUNNER_TEMP/warframe-builds.mcpb"
          npx -y @anthropic-ai/mcpb@2.1.2 unpack "$RUNNER_TEMP/warframe-builds.mcpb" "$RUNNER_TEMP/unpacked"
          node scripts/check-server.mjs "$RUNNER_TEMP/unpacked/server.mjs"

  # Installs follow the release branch, so only code that passed every test reaches people's computers.
  release:
    needs: [test, install]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh scripts/publish-release.sh
      - name: Publish the desktop extension and lite skill when the version changes
        run: |
          version="v$(node -p "require('./package.json').version")"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "$version is already published."
            exit 0
          fi
          npx -y @anthropic-ai/mcpb@2.1.2 pack . warframe-builds.mcpb
          (cd skills && zip -r ../warframe-builder-lite.zip warframe-builder-lite)
          gh release create "$version" warframe-builds.mcpb warframe-builder-lite.zip --target "$GITHUB_SHA" --title "$version" --notes "Install steps are in INSTALL.md."

  # Runs the exact command from INSTALL.md against what people now get. On Windows it also runs the cmd form.
  verify-release:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y github:${{ github.repository }}#release --version
      - if: runner.os == 'Windows'
        shell: cmd
        run: npx -y github:${{ github.repository }}#release --version
