name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # Installs follow the release branch, so only code that passed every test reaches people's computers.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh scripts/publish-release.sh
      - name: Publish the desktop extension when the version changes
        run: |
          version="v$(node -p "require('./package.json').version")"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "$version is already published."
            exit 0
          fi
          npx -y @anthropic-ai/mcpb@2.1.2 pack . warframe-builds.mcpb
          gh release create "$version" warframe-builds.mcpb --target "$GITHUB_SHA" --title "$version" --notes "Install steps are in INSTALL.md."
