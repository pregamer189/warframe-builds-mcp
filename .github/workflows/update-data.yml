name: Update game data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The import stops on unexpected values, and the tests must pass before anything is committed.
      - run: npm run import-data
      - run: npm test
      - name: Commit if more than the import date changed
        run: |
          changed=$(git diff --unified=0 data.json | grep -E '^[-+] ' | grep -vc '"imported"' || true)
          if [ "$changed" -eq 0 ]; then
            echo "No game data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update game data"
          git push
